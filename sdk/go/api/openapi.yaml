openapi: 3.0.2
info:
  description: avi api swagger
  title: avi
  version: 0.0.1
servers:
- url: "{protocol}://{server}:{port}/api/v1"
  variables:
    port:
      default: "9000"
    protocol:
      default: http
      enum:
      - http
      - https
    server:
      default: localhost
paths:
  /health-check:
    get:
      description: Returns 200 if service works okay.
      operationId: healthCheck
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/healthCheck_200_response'
          description: Freon internal health-check
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
  /base/chain-list:
    get:
      operationId: baseChainList
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Network'
                type: array
          description: response
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
      summary: get support network list
      tags:
      - base
  /token-info:
    post:
      operationId: tokenInfo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tokenInfo_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenInfo'
          description: Token information response
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Not found
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
      summary: Get latest info about a specific token
      tags:
      - token
  /token-info/list:
    post:
      operationId: tokenList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tokenList_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenList_200_response'
          description: Token info list response
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Not found
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
      summary: "Get token info list with pagination, sorting, and optional trade stats"
      tags:
      - token
  /dex/pair-info/update-status:
    post:
      operationId: updatePairsStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updatePairsStatus_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updatePairsStatus_200_response'
          description: Successfully updated pair statuses
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Not found
      summary: Update the status of multiple trading pairs
      tags:
      - dex
  /dex/pair-info:
    post:
      operationId: pairInfo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pairInfo_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairInfo'
          description: response
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Not found
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
      summary: get latest info about pair
      tags:
      - dex
  /dex/pair-info/list:
    post:
      operationId: pairList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pairList_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pairList_200_response'
          description: response
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Bad request
      summary: get all pairs from blockchain with pagination and chosen network
      tags:
      - dex
  /dex/farm-info:
    post:
      operationId: farmInfo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pairInfo_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmInfo'
          description: response
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Not found
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
      summary: get farm info by address
      tags:
      - farm
  /dex/farm-info/list:
    post:
      operationId: farmList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/farmList_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/farmList_200_response'
          description: response
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
      summary: get all farms from blockchain with pagination and chosen network
      tags:
      - farm
  /dex/dex-info/list:
    post:
      operationId: dexInfoList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dexInfoList_request'
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dexInfoList_200_response'
          description: response
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
      summary: get all dexes from blockchain with pagination and chosen network
      tags:
      - dex
  /dex/pair-orderbook/list:
    post:
      operationId: pairOrderBookList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pairOrderBookList_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pairOrderBookList_200_response'
          description: response
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Bad request
      summary: get all pair swap transactions
      tags:
      - dex
  /dex/price-charts:
    get:
      operationId: pairCharts
      parameters:
      - description: pair address (format 0x...)
        explode: true
        in: query
        name: address
        required: true
        schema:
          minLength: 20
          type: string
        style: form
      - description: "blockchain network (ethereum, bsc, polygon...)"
        explode: true
        in: query
        name: network
        required: true
        schema:
          $ref: '#/components/schemas/NetworkType'
        style: form
      - description: resolution of timeframe
        explode: true
        in: query
        name: res
        required: true
        schema:
          $ref: '#/components/schemas/ResolutionType'
        style: form
      - description: start time
        explode: true
        in: query
        name: from
        required: true
        schema:
          format: int64
          type: integer
        style: form
      - description: end time
        explode: true
        in: query
        name: to
        required: true
        schema:
          format: int64
          type: integer
        style: form
      - explode: true
        in: query
        name: price_from_quote
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - explode: true
        in: query
        name: volume_from_quote
        required: false
        schema:
          default: true
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartCandles'
          description: array of historical price candles
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
      summary: price charts for dex pair
      tags:
      - chart
  /nft/collection-orderbook/list:
    post:
      operationId: nftCollectionOrderBookList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/nftCollectionOrderBookList_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nftCollectionOrderBookList_200_response'
          description: response
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Bad request
      summary: get all nft collection transactions
      tags:
      - nft
  /nft/collection-info:
    post:
      operationId: nftCollection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pairInfo_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NftCollectionInfo'
          description: response
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Not found
      summary: get latest info about nft collection
      tags:
      - nft
  /nft/collection-info/list:
    post:
      operationId: nftCollectionList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/nftCollectionList_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nftCollectionList_200_response'
          description: response
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Bad request
      summary: get all nft collections from blockchain with pagination and chosen
        network
      tags:
      - nft
  /nft/asset-info:
    post:
      operationId: nftAsset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/nftAsset_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NftAssetInfo'
          description: response
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Not found
      summary: get latest info about nft asset
      tags:
      - nft
  /nft/asset-info/list:
    post:
      operationId: nftAssetInfoList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/nftAssetInfoList_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nftAssetInfoList_200_response'
          description: response
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Bad request
      summary: get asset info list
      tags:
      - nft
  /wallet/info:
    post:
      operationId: walletInfo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pairInfo_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletInfo'
          description: response
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenInfo_400_response'
          description: Not found
        default:
          content:
            application/json:
              example:
                errors:
                - type: API_ERROR
                  code: REQUEST_TIMED_OUT
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Server error. Retrying the request as is should succeed eventually.
      summary: get latest info about wallet by address
      tags:
      - wallet
components:
  responses:
    "204NoContent":
      description: No content in response
    "400BadRequest":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/tokenInfo_400_response'
      description: Bad request
    "401Unauthorized":
      description: Authorization information is missing or invalid.
    "404NotFound":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/tokenInfo_400_response'
      description: Not found
    "500InternalSystemError":
      content:
        application/json:
          example:
            errors:
            - type: API_ERROR
              code: REQUEST_TIMED_OUT
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
      description: Server error. Retrying the request as is should succeed eventually.
  schemas:
    NetworkType:
      enum:
      - ethereum
      - bsc
      - polygon
      - avalanche
      - arbitrum
      - base
      - optimism
      - ton
      - fantom
      type: string
    OrderBy:
      default: desc
      enum:
      - asc
      - desc
      type: string
    PairState:
      description: State of a trading pair
      enum:
      - 0
      - 1
      - 2
      - 50
      - 51
      - 52
      - 53
      - 54
      type: integer
    ResolutionType:
      description: Available chart resolutions
      enum:
      - "1"
      - "3"
      - "5"
      - "15"
      - "30"
      - "45"
      - 1H
      - 2H
      - 4H
      - 6H
      - 12H
      - 1D
      - 1W
      - 1M
      - 6M
      - 1Y
      type: string
    TxType:
      default: all
      enum:
      - all
      - buy
      - sell
      - mint
      - burn
      - add_liquidity
      - remove_liquidity
      type: string
    Address:
      minLength: 20
      type: string
    Network:
      example:
        chain_id: 0
        dexes: 6
        name: name
        tvl: tvl
        pairs: 1
      properties:
        name:
          type: string
        chain_id:
          format: uint32
          type: integer
        dexes:
          format: uint64
          type: integer
        pairs:
          format: uint64
          type: integer
        tvl:
          type: string
      required:
      - chain_id
      - name
      type: object
    Dex:
      example:
        factory: factory
        chain_id: 0
        lp_token_symbol: lp_token_symbol
        name: name
      properties:
        name:
          type: string
        factory:
          minLength: 20
          type: string
        chain_id:
          format: uint32
          type: integer
        lp_token_symbol:
          type: string
      required:
      - chain_id
      - factory
      - lp_token_symbol
      - name
      type: object
    Transaction:
      example:
        maker_address: maker_address
        chain_id: 0
        to_address: to_address
        block_info:
          gas_used: 5
          block_number: 6
          fee_usd: 5.637376656633329
          log_index: 1
        event_data:
          price0: 9.301444243932576
          amount1: 7.061401241503109
          amount0: 2.3021358869347655
          price_usd0: 2.027123023002322
          price_usd1: 4.145608029883936
          price1: 3.616076749251911
        tx_type: all
        from_address: from_address
        hash: hash
        timestamp: timestamp
      properties:
        timestamp:
          type: string
        hash:
          type: string
        chain_id:
          format: uint32
          type: integer
        maker_address:
          minLength: 20
          type: string
        from_address:
          minLength: 20
          type: string
        to_address:
          minLength: 20
          type: string
        tx_type:
          $ref: '#/components/schemas/TxType'
        block_info:
          $ref: '#/components/schemas/Transaction_block_info'
        event_data:
          $ref: '#/components/schemas/Transaction_event_data'
      required:
      - block_info
      - chain_id
      - event_data
      - from_address
      - hash
      - maker_address
      - timestamp
      - to_address
      - tx_type
      type: object
    SwapEventData:
      example:
        price0: 9.301444243932576
        amount1: 7.061401241503109
        amount0: 2.3021358869347655
        price_usd0: 2.027123023002322
        price_usd1: 4.145608029883936
        price1: 3.616076749251911
      properties:
        amount0:
          format: float64
          type: number
        amount1:
          format: float64
          type: number
        price0:
          format: float64
          type: number
        price1:
          format: float64
          type: number
        price_usd0:
          format: float64
          type: number
        price_usd1:
          format: float64
          type: number
      required:
      - amount0
      - amount1
      - price0
      - price1
      - price_usd0
      - price_usd1
      type: object
    LiquidityEventData:
      properties:
        tokens:
          items:
            $ref: '#/components/schemas/LiquidityTokenChange'
          type: array
        liquidity_usd:
          format: float
          type: number
      required:
      - tokens
      type: object
    LiquidityTokenChange:
      properties:
        address:
          minLength: 20
          type: string
        symbol:
          type: string
        amount:
          format: float64
          type: number
        price_usd:
          format: float64
          type: number
      required:
      - address
      - amount
      - price_usd
      type: object
    EthereumTxData:
      example:
        gas_used: 5
        block_number: 6
        fee_usd: 5.637376656633329
        log_index: 1
      properties:
        block_number:
          type: integer
        log_index:
          type: integer
        gas_used:
          type: integer
        fee_usd:
          type: number
      required:
      - block_number
      - fee_usd
      - gas_used
      - log_index
      type: object
    TonTxData:
      properties:
        seq_no:
          type: integer
        shard_id:
          type: integer
        work_chain:
          type: integer
      required:
      - seq_no
      - shard_id
      - work_chain
      type: object
    NftTransaction:
      example:
        address: address
        event_type: event_type
        token_id: token_id
        chain_id: 6
        block_number: 0
        to_address: to_address
        from_address: from_address
        hash: hash
        timestamp: timestamp
      properties:
        timestamp:
          type: string
        hash:
          type: string
        from_address:
          minLength: 20
          type: string
        to_address:
          minLength: 20
          type: string
        address:
          minLength: 20
          type: string
        token_id:
          type: string
        event_type:
          type: string
        block_number:
          format: uint64
          type: integer
        chain_id:
          format: uint32
          type: integer
      required:
      - address
      - block_number
      - chain_id
      - event_type
      - from_address
      - hash
      - timestamp
      - to_address
      - token_id
      type: object
    TypeToken:
      enum:
      - stable
      - wrapped
      - common
      type: string
    BaseToken:
