          $ref: '#/components/schemas/BaseToken'
        to_token:
          $ref: '#/components/schemas/BaseToken'
        feeAvgUSD:
          type: string
        maxHops:
          type: integer
          format: uint32
          minimum: 0
        route:
          $ref: '#/components/schemas/RouterPath'

    RouterTxArgs:
      type: object
      required:
        - to_address
        - chain_id
        - gas_limit
        - amount_in
        - minimum_amount_out
        - value
      properties:
        to_address:
          $ref: '#/components/schemas/Address'
        amount_in:
          type: string
          minLength: 1
        minimum_amount_out:
          type: string
          minLength: 1
        chain_id:
          type: integer
          format: uint32
          minimum: 1
        gas_limit:
          type: integer
          format: uint64
          minimum: 1
