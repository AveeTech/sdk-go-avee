      properties:
        from_token:
          $ref: '#/components/schemas/BaseToken'
        to_token:
          $ref: '#/components/schemas/BaseToken'
        pair:
          $ref: '#/components/schemas/Address'
        position:
          type: integer
          format: uint32
          minimum: 0

    RouterPath:
      type: array
      items:
        $ref: '#/components/schemas/RouterHop'

    WalletInfo:
      type: object
      required:
        - address
        - chain_id
        - total_amount_usd
        - tokens
      properties:
        address:
          $ref: '#/components/schemas/Address'
        chain_id:
          type: integer
          format: uint32
          minimum: 1
        total_amount_usd:
          type: number
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/WalletTokenInfo'

    WalletTokenInfo:
      type: object
      required:
        - address
        - symbol
        - amount
        - amount_usd
        - price_usd
      properties:
        address:
          $ref: '#/components/schemas/Address'
        symbol:
          type: string
        amount:
          type: string
        amount_usd:
          type: string
        price_usd:
          type: string

    PaginationCount:
      type: integer
      format: uint32
      minimum: 10
      maximum: 1000
      default: 10

    Error:
      type: object
      required:
        - code
        - message
        - description
      properties:
        code:
          description: HTTP status
          type: integer
          format: int32
        message:
          type: string
        description:
          type: string

    APIErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            required:
              - type
              - message
            properties:
              type:
                type: string
                enum: [ BAD_REQUEST, USER_ERROR, INVALID_REQUEST_ERROR, API_ERROR ]
              code:
                $ref: "#/components/schemas/APIErrorCode"
              message:
                type: string
                maxLength: 200
              param:
                type: string
                maxLength: 200

    APIErrorCode:
      type: string
      minLength: 1
      maxLength: 32
      enum:
        - INVALID_REQUEST_PARAMETERS
        - INVALID_REQUEST_BODY
        - INVALID_REQUEST
        - ALREADY_EXISTS
        - RATE_IS_EXCEEDED

  responses:
    204NoContent:
      description: No content in response

    400BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            properties:
              message:
                description: A human-readable explanation specific to this occurrence of the problem
                type: string
              status:
                description: The HTTP status code for this occurrence of the problem
                example: 404
                format: int
                type: integer
            required:
              - message
              - status
            type: object

    401Unauthorized:
      description: Authorization information is missing or invalid.

    404NotFound:
      description: Not found
      content:
        application/json:
          schema:
            properties:
              message:
                description: A human-readable explanation specific to this occurrence of the problem
                type: string
              status:
                description: The HTTP status code for this occurrence of the problem
                example: 404
                format: int
                type: integer
            required:
              - message
              - status
            type: object

    500InternalSystemError:
      description: Server error. Retrying the request as is should succeed eventually.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/APIErrorResponse" }
          example:
            "errors": [
              {
                "type": "API_ERROR",
                "code": "REQUEST_TIMED_OUT"
              }
            ]
