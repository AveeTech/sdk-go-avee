        - count_pairs
      properties:
        id:
          type: string
          description: The unique identifier of the protocol (e.g., UniswapV2Factory).
        tvl:
          type: number
          format: double
          description: Total value locked in the protocol.
        average_liquidity_per_pair:
          type: number
          format: double
          description: Average liquidity found per pair within this protocol.
        max_liquidity:
          type: number
          format: double
