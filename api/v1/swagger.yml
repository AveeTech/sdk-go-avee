openapi: 3.0.2

info:
  title: avi
  version: 0.0.1
  description: avi api swagger

servers:
  - url: '{protocol}://{server}:{port}/api/v1'
    variables:
      port:
        default: '9000'
      protocol:
        default: http
        enum:
          - http
          - https
      server:
        default: localhost

paths:
  /health-check:
    get:
      operationId: healthCheck
      description: Returns 200 if service works okay.
      responses:
        '200':
          description: Freon internal health-check
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        default: { $ref: '#/components/responses/500InternalSystemError' }

  /base/chain-list:
    get:
      tags:
        - base
      operationId: baseChainList
      summary: get support network list
      responses:
        '200':
          description: response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Network'
        default:
          $ref: '#/components/responses/500InternalSystemError'

  /token-info:
    post:
      operationId: tokenInfo
      tags:
        - token
      summary: Get latest info about a specific token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
                - network
              properties:
                address:
                  $ref: '#/components/schemas/Address'
                network:
                  $ref: '#/components/schemas/NetworkType'
                res:
                  type: array
                  items:
                    $ref: '#/components/schemas/ResolutionType'
                  description: Optional list of time resolutions for price changes
      responses:
        '200':
          description: Token information response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenInfo'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        default:
          $ref: '#/components/responses/500InternalSystemError'

  /token-info/list:
    post:
      operationId: tokenList
      tags:
        - token
      summary: Get token info list with pagination, sorting, and optional trade stats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - count
              properties:
                networks:
                  type: array
                  items:
                    $ref: '#/components/schemas/NetworkType'
                  description: Filter by blockchain networks
                sort_by:
                  type: string
                  enum: [ liquidity, price_usd, updated_at, created_at, price_change ]
                  default: "liquidity"
                  description: Sorting field
                sort_value:
                  type: string
                res:
                  $ref: '#/components/schemas/ResolutionType'
                order_by:
                  $ref: '#/components/schemas/OrderBy'
                cursor:
                  type: string
                  description: Cursor for pagination
                count:
                  $ref: '#/components/schemas/PaginationCount'
      responses:
        '200':
          description: Token info list response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TokenInfo'
                  nextCursor:
                    type: string
                  backCursor:
                    type: string
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        default:
          $ref: '#/components/responses/500InternalSystemError'

  /dex/pair-info/update-status:
    post:
      operationId: updatePairsStatus
      tags:
        - dex
      summary: Update the status of multiple trading pairs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pairs
              properties:
                pairs:
                  type: array
                  items:
                    type: object
                    required:
                      - address
                      - chain_id
                      - new_status
                      - reason
                    properties:
                      address:
                        $ref: '#/components/schemas/Address'
                      chain_id:
                        type: integer
                        format: uint32
                      new_status:
                        $ref: '#/components/schemas/PairState'
                      reason:
                        type: string
      responses:
        '200':
          description: Successfully updated pair statuses
          content:
            application/json:
              schema:
                type: object
                required:
                  - updated_pairs
                properties:
                  updated_pairs:
                    type: array
                    items:
                      type: string
                    description: "Successfully updated pairs"
        default:
          $ref: '#/components/responses/500InternalSystemError'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'

  /dex/pair-info:
    post:
      operationId: pairInfo
      tags:
        - dex
      summary: get latest info about pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
                - network
              properties:
                address:
                  $ref: '#/components/schemas/Address'
                network:
                  $ref: '#/components/schemas/NetworkType'
      responses:
        '200':
          description: response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairInfo'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        default:
          $ref: '#/components/responses/500InternalSystemError'

  /dex/pair-info/list:
    post:
      operationId: pairList
      tags:
        - dex
      summary: get all pairs from blockchain with pagination and chosen network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - count
              properties:
                networks:
                  type: array
                  items:
                    $ref: '#/components/schemas/NetworkType'
                sort_by:
                  type: string
                  enum: [ apr, liquidity, updated_at, created_at ]
                  default: "liquidity"
                sort_value:
                  type: string
                order_by:
                  $ref: '#/components/schemas/OrderBy'
                search:
                  type: string
                  description: search by ticker or dex name
                min_liquidity_usd:
                  type: number
                  format: double
                max_liquidity_usd:
                  type: number
                  format: double
                dex_names:
                  type: array
                  items:
                    type: string
                    minLength: 3
                dex_protocols:
                  type: array
                  items:
                    type: string
                    minLength: 3
                dex_factory_types:
                  type: array
                  items:
                    type: string
                    enum:
                      - curveV2
                      - stonfiV1
                      - stonfiV2
                      - dedustV1
                      - balancerV2
                      - uniswapV2
                      - uniswapV3
                cursor:
                  type: string
                count:
                  $ref: '#/components/schemas/PaginationCount'
      responses:
        '200':
          description: response
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PairInfo'
                  nextCursor:
                    type: string
                    minLength: 1
                  backCursor:
                    type: string
                    minLength: 1
        default:
          $ref: '#/components/responses/500InternalSystemError'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /dex/farm-info:
    post:
      operationId: farmInfo
      tags:
        - farm
      summary: get farm info by address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
                - network
              properties:
                address:
                  $ref: '#/components/schemas/Address'
                network:
                  $ref: '#/components/schemas/NetworkType'
      responses:
        '200':
          description: response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmInfo'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        default:
          $ref: '#/components/responses/500InternalSystemError'

  /dex/farm-info/list:
    post:
      operationId: farmList
      tags:
        - farm
      summary: get all farms from blockchain with pagination and chosen network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - count
              properties:
                networks:
                  type: array
                  items:
                    $ref: '#/components/schemas/NetworkType'
                factory_addresses:
                  type: array
                  items:
                    $ref: '#/components/schemas/Address'
                sort_by:
                  type: string
                  enum: [ liquidity, apr, updated_at ]
                  default: "liquidity"
                sort_value:
                  type: string
                order_by:
                  $ref: '#/components/schemas/OrderBy'
                search:
                  type: string
                cursor:
                  type: string
                count:
                  $ref: '#/components/schemas/PaginationCount'
      responses:
        '200':
          description: response
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FarmInfo'
                  nextCursor:
                    type: string
                    minLength: 1
                  backCursor:
                    type: string
                    minLength: 1
        default:
          $ref: '#/components/responses/500InternalSystemError'

  /dex/dex-info/list:
    post:
      operationId: dexInfoList
      tags:
        - dex
      summary: get all dexes from blockchain with pagination and chosen network
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  $ref: '#/components/schemas/NetworkType'
      responses:
        '200':
          description: response
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - count
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DexInfo'
                  count:
                    type: integer
                    format: uint64
        default:
          $ref: '#/components/responses/500InternalSystemError'

  /dex/pair-orderbook/list:
    post:
      operationId: pairOrderBookList
      tags:
        - dex
      summary: get all pair swap transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
                - network
                - count
              properties:
                address:
                  $ref: '#/components/schemas/Address'
                network:
                  $ref: '#/components/schemas/NetworkType'
                page:
                  type: integer
                  format: uint32
                  default: 1
                  minimum: 1
                cursor:
                  type: string
                maker_address:
                  type: string
                order_by:
                  $ref: '#/components/schemas/OrderBy'
                tx_type:
                  type: array
                  items:
                    $ref: '#/components/schemas/TxType'
                min_timestamp:
                  type: string
                  description: timestamp in RFC3339 with UTC
                max_timestamp:
                  type: string
                  description: timestamp in RFC3339 with UTC
                count:
                  $ref: '#/components/schemas/PaginationCount'
      responses:
        '200':
          description: response
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  nextCursor:
                    type: string
                    minLength: 1
                  backCursor:
                    type: string
                    minLength: 1
        default:
          $ref: '#/components/responses/500InternalSystemError'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /dex/price-charts:
    get:
      operationId: pairCharts
      tags:
        - chart
      summary: price charts for dex pair
      parameters:
        - in: query
          name: address
          schema:
            type: string
            minLength: 20
          required: true
          description: pair address (format 0x...)
        - in: query
          name: network
          schema:
            $ref: '#/components/schemas/NetworkType'
          required: true
          description: blockchain network (ethereum, bsc, polygon...)
        - in: query
          name: res
          schema:
            $ref: '#/components/schemas/ResolutionType'
          required: true
          description: resolution of timeframe
        - in: query
          name: from
          schema:
            type: integer
            format: int64
          required: true
          description: start time
        - in: query
          name: to
          schema:
            type: integer
            format: int64
          required: true
          description: end time
        - in: query
          name: price_from_quote
          schema:
            type: boolean
            default: false
          required: false
        - in: query
          name: volume_from_quote
          schema:
            type: boolean
            default: true
          required: false
      responses:
        '200':
          description: array of historical price candles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartCandles'
        default:
          $ref: '#/components/responses/500InternalSystemError'

  /nft/collection-orderbook/list:
    post:
      operationId: nftCollectionOrderBookList
      tags:
        - nft
      summary: get all nft collection transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
                - network
                - count
              properties:
                address:
                  $ref: '#/components/schemas/Address'
                network:
                  $ref: '#/components/schemas/NetworkType'
                cursor:
                  type: string
                  minLength: 1
                count:
                  $ref: '#/components/schemas/PaginationCount'
      responses:
        '200':
          description: response
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NftTransaction'
                  nextCursor:
                    type: string
                  backCursor:
                    type: string
        default:
          $ref: '#/components/responses/500InternalSystemError'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /nft/collection-info:
    post:
      operationId: nftCollection
      tags:
        - nft
      summary: get latest info about nft collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
                - network
              properties:
                address:
                  $ref: '#/components/schemas/Address'
                network:
                  $ref: '#/components/schemas/NetworkType'
      responses:
        '200':
          description: response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NftCollectionInfo'
        default:
          $ref: '#/components/responses/500InternalSystemError'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'

  /nft/collection-info/list:
    post:
      operationId: nftCollectionList
      tags:
        - nft
      summary: get all nft collections from blockchain with pagination and chosen network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - network
                - count
              properties:
                network:
                  $ref: '#/components/schemas/NetworkType'
                cursor:
                  type: string
                  minLength: 1
                count:
                  $ref: '#/components/schemas/PaginationCount'
      responses:
        '200':
          description: response
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NftCollectionInfo'
                  nextCursor:
                    type: string
                  backCursor:
                    type: string
        default:
          $ref: '#/components/responses/500InternalSystemError'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /nft/asset-info:
    post:
      operationId: nftAsset
      tags:
        - nft
      summary: get latest info about nft asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
                - token_id
                - network
              properties:
                address:
                  $ref: '#/components/schemas/Address'
                token_id:
                  type: string
                network:
                  $ref: '#/components/schemas/NetworkType'
      responses:
        '200':
          description: response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NftAssetInfo'
        default:
          $ref: '#/components/responses/500InternalSystemError'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'

  /nft/asset-info/list:
    post:
      operationId: nftAssetInfoList
      tags:
        - nft
      summary: get asset info list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collection_address
                - network
                - count
              properties:
                collection_address:
                  $ref: '#/components/schemas/Address'
                network:
                  $ref: '#/components/schemas/NetworkType'
                cursor:
                  type: string
                  minLength: 1
                count:
                  $ref: '#/components/schemas/PaginationCount'
      responses:
        '200':
          description: response
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NftAssetInfo'
                  nextCursor:
                    type: string
                  backCursor:
                    type: string
        default:
          $ref: '#/components/responses/500InternalSystemError'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /wallet/info:
    post:
      operationId: walletInfo
      tags:
        - wallet
      summary: get latest info about wallet by address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
                - network
              properties:
                address:
                  $ref: '#/components/schemas/Address'
                network:
                  $ref: '#/components/schemas/NetworkType'
      responses:
        '200':
          description: response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletInfo'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        default:
          $ref: '#/components/responses/500InternalSystemError'

