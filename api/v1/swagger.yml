components:
  schemas:
    NetworkType:
      type: string
      enum:
        - ethereum
        - bsc
        - polygon
        - avalanche
        - arbitrum
        - base
        - optimism
        - ton
        - fantom

    OrderBy:
      type: string
      default: desc
      enum:
        - asc
        - desc

    PairState:
      type: integer
      description: "State of a trading pair"
      enum:
        - 0   # Default stable state
        - 1   # Verified Pair: checked by manual moderation
        - 2   # Unconfirmed: pair exists on-chain but has not been verified by other providers yet
        - 50  # Low risk: anomalies detected occasionally
        - 51  # Moderate risk: liquidity or price anomalies detected frequently
        - 52  # High risk: liquidity or price anomalies detected constantly
        - 53  # Severe risk: value is critically out of bounds
        - 54  # Scam: mimics popular token symbols or uses deceptive practices

    ResolutionType:
      type: string
      description: Available chart resolutions
      enum: [ "1", "3", "5", "15", "30", "45", "1H", "2H", "4H", "6H", "12H", "1D", "1W", "1M", "6M", "1Y" ]

    TxType:
      type: string
      default: all
      enum:
        - all
        - buy
        - sell
        - mint
        - burn
        - add_liquidity
        - remove_liquidity

    Address:
      type: string
      minLength: 20

    Network:
      type: object
      required:
        - name
        - chain_id
      properties:
        name:
          type: string
        chain_id:
          type: integer
          format: uint32
        dexes:
          type: integer
          format: uint64
        pairs:
          type: integer
          format: uint64
        tvl:
          type: string

    Dex:
      type: object
      required:
        - name
        - factory
        - chain_id
        - lp_token_symbol
      properties:
        name:
          type: string
        factory:
          $ref: '#/components/schemas/Address'
        chain_id:
          type: integer
          format: uint32
        lp_token_symbol:
          type: string

    Transaction:
      type: object
      required:
        - timestamp
        - hash
        - chain_id
        - tx_type
        - maker_address
        - from_address
        - to_address
        - block_info
        - event_data
      properties:
        timestamp:
          type: string
        hash:
          type: string
        chain_id:
          type: integer
          format: uint32
        maker_address:
          $ref: '#/components/schemas/Address'
        from_address:
          $ref: '#/components/schemas/Address'
        to_address:
          $ref: '#/components/schemas/Address'
        tx_type:
          $ref: '#/components/schemas/TxType'
        block_info:
          type: object
          oneOf:
            - $ref: '#/components/schemas/EthereumTxData'
            - $ref: '#/components/schemas/TonTxData'
        event_data:
          type: object
          oneOf:
            - $ref: '#/components/schemas/SwapEventData'
            - $ref: '#/components/schemas/LiquidityEventData'

    SwapEventData:
      type: object
      required:
        - amount0
        - amount1
        - price0
        - price1
        - price_usd0
        - price_usd1
      properties:
        amount0:
          type: number
          format: float64
        amount1:
          type: number
          format: float64
        price0:
          type: number
          format: float64
        price1:
          type: number
          format: float64
        price_usd0:
          type: number
          format: float64
        price_usd1:
          type: number
          format: float64

    LiquidityEventData:
      type: object
      required:
        - tokens
      properties:
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/LiquidityTokenChange'
        liquidity_usd:
          type: number
          format: float

    LiquidityTokenChange:
      type: object
      required:
        - address
        - amount
        - price_usd
      properties:
        address:
          $ref: '#/components/schemas/Address'
        symbol:
          type: string
        amount:
          type: number
          format: float64
        price_usd:
          type: number
          format: float64

    EthereumTxData:
      type: object
      required:
        - block_number
