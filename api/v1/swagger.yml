          description: The unique identifier of the DEX.
        total_tvl:
          type: number
          format: double
          description: The total value locked across all networks and protocols.
        total_pairs:
          type: integer
          format: uint32
          description: The total number of trading pairs across all networks and protocols.
        total_networks:
          type: integer
          format: uint32
          description: The total number of distinct blockchain networks supported.
        supported_networks:
          type: array
          items:
            $ref: '#/components/schemas/NetworkInfo'
          description: A list of networks supported by the DEX, detailing each network's protocols.

    NetworkInfo:
      type: object
      required:
        - chain
        - chain_id
      properties:
        chain:
          type: string
          description: The name of the blockchain network (e.g., Ethereum, Binance Smart Chain).
        chain_id:
          type: integer
          format: uint32
          description: The unique identifier of the blockchain network.
        protocols:
          type: array
          items:
            $ref: '#/components/schemas/ProtocolInfo'
          description: A list of protocols available on this network with respective stats.

    ProtocolInfo:
      type: object
      required:
